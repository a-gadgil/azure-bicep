stages:
  - validate
  - deploy

validate_templates:
  stage: validate
  image: mcr.microsoft.com/azure-cli:latest
  script:
    - az bicep install
    - az bicep build --file templates/main.bicep
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

deploy_infrastructure:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  script:
    - az bicep install
    - echo "Authenticating with Azure..."
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - echo "Deploying Bicep templates to Azure..."
    - az deployment group create --resource-group rg-devops-core-dev --template-file templates/main.bicep --parameters adminPassword="$ADMIN_PASSWORD"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'