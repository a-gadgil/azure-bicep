stages:
  - lint
  - build
  - security

image: mcr.microsoft.com/azure-cli:latest

variables:
  BICEP_VERSION: "latest"

before_script:
  - echo "Initializing Azure CLI and Bicep tools..."
  - az --version
  - az bicep install || true
  - az bicep upgrade || true

# 1. Static Linter Check
bicep_lint:
  stage: lint
  script:
    - echo "Running Bicep linter on modules..."
    - az bicep lint --file modules/compute.bicep
    - az bicep lint --file modules/storage.bicep
    - az bicep lint --file modules/keyvault.bicep
    - az bicep lint --file modules/networking.bicep
    - az bicep lint --file modules/acr.bicep
    - az bicep lint --file modules/sqldatabase.bicep
    # Alternatively, you can use a dynamic loop:
    # for f in modules/*.bicep; do az bicep lint --file "$f"; done

# 2. Compilation / Build Check (Translates Bicep to ARM JSON)
bicep_build:
  stage: build
  script:
    - echo "Compiling environment Bicep templates into ARM JSON..."
    - az bicep build --file environments/dev/main.bicep || echo "Check dev main.bicep"
    - az bicep build --file environments/stag/main.bicep || echo "Check stag main.bicep"
    - az bicep build --file environments/prod/main.bicep || echo "Check prod main.bicep"
  artifacts:
    name: "arm-templates-$CI_COMMIT_SHA"
    expire_in: 7 days
    paths:
      - environments/**/main.json

# 3. Security & Compliance Scanning via Checkov
security_scan:
  stage: security
  image: python:3.11-slim
  before_script:
    - pip install checkov
  script:
    - echo "Running Checkov security scan on Bicep templates..."
    - checkov -d modules/ -d environments/ --framework bicep
  allow_failure: false